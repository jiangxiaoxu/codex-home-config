name = "explorer"
description = """
Use when a read-only investigation needs scope discovery, substantial causal reasoning, or synthesis across subsystems or sources. The question, known constraints, and relevant evidence should be available, while the exact search scope can be discovered within those bounds.
"""
model = "gpt-5.6-terra"
