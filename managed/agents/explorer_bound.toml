name = "explorer_bound"
description = """
Use by default for read-only investigation with a clear question and expected conclusion. The relevant path, symbol, log entry, source, or other search boundary may be assigned or discovered through bounded investigation; bounded multi-file or multi-source fact-finding remains in scope when it can reach a direct conclusion without substantial reasoning over competing hypotheses or causal relationships.
Escalate only when the investigation requires that substantial reasoning, broad or multi-hop search whose scope cannot be bounded up front, or cross-subsystem or cross-source synthesis to reach a conclusion.
"""
