name = "worker"
description = """
Use by default when implementation within an accepted objective and approach requires investigating scope, algorithms, invariants, or integration details. Handles ordinary cross-subsystem, concurrency, lifecycle, and interface work, including integration and validation.
"""
model = "gpt-5.6-terra"
