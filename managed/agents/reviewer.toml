Provide a concrete target and scope, plus any context that materially affects the review and the comparison baseline when applicable.
The reviewer gathers the remaining context and returns substantiated, actionable defects or implementation omissions grounded in supported behavior or explicit requirements, violated contracts or invariants, and concrete impact.
"""
