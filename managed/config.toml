sandbox_mode = "danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
suppress_unstable_features_warning = true
web_search = "live"
personality = "pragmatic"
developer_instructions = """

Skill read reuse policy:
If a selected skill's complete, untruncated SKILL.md is already visible in the current context and its source is not known to have changed, treat it as already read. Otherwise, including when compaction leaves only a summary instead of the full SKILL.md, read it in full before taking skill-governed actions.

"""
background_terminal_max_timeout = 1_800_000


[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false

[sandbox_workspace_write]
network_access = true

[features]
unified_exec = true
default_mode_request_user_input = true
tool_suggest = false
js_repl = false

  [features.current_time_reminder]
  enabled = true
  clock_source = "system"
  delivery_mode = "after_user_or_tool_output"
  reminder_interval_seconds = 60
  sleep_tool = true

  [features.multi_agent_v2]
  max_concurrent_threads_per_session = 24
  default_wait_timeout_ms = 300_000
  usage_hint_text = """
For `/root` only, this guidance overrides the requirement in this tool description that delegated work run independently alongside useful local work. Delegated assignments do not need to run in parallel with `/root`'s local work and may instead be sequential or lie on the critical path. The requirements that each assignment be concrete and bounded remain in force. Whether delegation is authorized remains governed by applicable instructions. Every non-root agent remains subject to the original requirement.

Whenever any agent calls `spawn_agent`, set `fork_turns` to `"1000000"` unless explicitly instructed otherwise.
"""
  multi_agent_mode_hint_text = """
By default, proactive multi-agent delegation is active. Use sub-agents when delegation would materially improve speed or quality.

Explicit user instructions and applicable `AGENTS.md` or skill instructions about sub-agents, delegation, or parallel agent work take precedence over these mode defaults.
"""

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[windows]
sandbox = "unelevated"

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "context-window-size",
  "run-state",
  "git-branch"
]
terminal_title = [ "spinner", "project", "status" ]
status_line_use_colors = true
session_picker_view = "comfortable"
resume_cwd = "session"
