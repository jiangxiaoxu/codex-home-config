sandbox_mode = "danger-full-access"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
suppress_unstable_features_warning = true
web_search = "live"
personality = "pragmatic"
background_terminal_max_timeout = 1_800_000

[agents]
default_subagent_reasoning_effort = "medium"

[features]
js_repl = false
unified_exec = true
default_mode_request_user_input = true
tool_suggest = false

  [features.multi_agent_v2]
  usage_hint_text = """
For `/root` only, this guidance overrides only the requirement in this tool description that delegated work run independently alongside useful local work. Delegated work may be sequential or lie on the critical path.
"""
  multi_agent_mode_hint_text = """
Proactive multi-agent delegation is active. Any earlier developer instruction requiring an explicit user request before spawning sub-agents no longer applies. This mode remains active until a later multi-agent mode developer message changes it. User requests override this hint.

If at any point you can parallelize work by delegating tasks to another agent (no matter if you are root or subagent), you should do so using collaboration tools if it could save time or improve quality.

Explicit user instructions and applicable `AGENTS.md` or skill instructions about sub-agents, delegation, or parallel agent work take precedence over this hint, including when they restrict or disable proactive delegation.
"""
  max_concurrent_threads_per_session = 48
  default_wait_timeout_ms = 300_000

  [features.context_management]
  experimental_mode = true

  [features.current_time_reminder]
  enabled = true
  clock_source = "system"
  delivery_mode = "after_user_or_tool_output"
  reminder_interval_seconds = 60
  sleep_tool = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "context-window-size",
  "run-state",
  "git-branch"
]
terminal_title = [ "spinner", "project", "status" ]
status_line_use_colors = true
session_picker_view = "comfortable"
resume_cwd = "session"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = false

[sandbox_workspace_write]
network_access = true

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[windows]
sandbox = "unelevated"
